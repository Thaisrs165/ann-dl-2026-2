# =============================================================================
#  Portfólio individual — Redes Neurais Artificiais & Deep Learning
#  Enunciados da disciplina: https://insper.github.io/ann-dl/
# =============================================================================
site_name: "ANN-DL · Thaís Silveira"
site_author: "Thaís Silveira"
site_url: "https://thaisrs165.github.io/ann-dl-2026-2/"
repo_url: "https://github.com/Thaisrs165/ann-dl-2026-2"
repo_name: "Thaisrs165/ann-dl-2026-2"

theme:
  name: material
  language: pt-BR
  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Mudar para o modo escuro

    # Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      toggle:
        icon: material/toggle-switch
        name: Mudar para a preferência do sistema
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  # Inclusão de arquivos (--8<--): use para trazer os scripts de code/ para o relatório
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption

plugins:
  - search:
      lang: pt
  # Lightbox nas figuras dos relatórios
  - glightbox
  - minify:
      minify_html: true
  # Renderiza notebooks .ipynb colocados diretamente na nav
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      include_source: true
      # Sem isto, os .py de code/ virariam páginas do site
      include: ["*.ipynb"]

# Além dos links, valida as âncoras (#secao) — com --strict, âncora quebrada vira erro.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# O dataset bruto do Exercise 3 nunca deve ser copiado para o site publicado, mesmo em um
# `mkdocs gh-deploy` local (que publica o que estiver em disco, gitignore à parte).
exclude_docs: |
  /exercises/data/spaceship-titanic/

# Os scripts de code/ ficam no repositório e são incluídos nos relatórios via --8<--,
# mas não são páginas da navegação.
not_in_nav: |
  /exercises/*/code/*

extra_javascript:
  # A configuração precisa vir ANTES da biblioteca do MathJax
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# =============================================================================
#  NAVEGAÇÃO — uma entrega, um item de menu.
# =============================================================================
nav:
  - Home: index.md
  - Exercises:
      - Overview: exercises/index.md
      - Data: exercises/data/index.md
      - Perceptron: exercises/perceptron/index.md
      - MLP: exercises/mlp/index.md
      - VAE: exercises/vae/index.md
  - Project:
      - Overview: projects/index.md
